name: PokeMod — Tests + APK

on:
  push:
    branches: ["arena/01a0de4c-fire-ash-modifier"]
    paths: ["web/**", "android/**", "tools/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch: {}
  release:
    types: [created]

jobs:
  test:
    name: Tests JS (Marshal/PBS/Table)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Marshal round-trip
        run: node web/js/marshal.test.mjs
      - name: Integración del núcleo
        run: node web/js/integration.test.mjs
      - name: Sintaxis de todos los módulos
        run: |
          for f in web/js/*.js; do
            case "$f" in *.test.mjs) continue;; esac
            node --check "$f" || exit 1
          done
          echo "Todos los módulos OK"

  build-apk:
    name: Compilar APK (debug)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK Android (el runner ya lo trae; verificar)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || ls "$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || echo "SDK ya presente, sigo"
      - name: Instalar Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH
          /tmp/gradle-8.7/bin/gradle --version
      - name: Compilar APK (debug)
        run: |
          cd android
          gradle assembleDebug --stacktrace > /tmp/gradle.log 2>&1
          echo "GRADLE_EXIT=$?" >> $GITHUB_ENV
          tail -n 40 /tmp/gradle.log
          exit "$GRADLE_EXIT"
      - name: Publicar log si falla (diagnóstico)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 /tmp/gradle.log > /tmp/tail.txt || echo "(sin log)" > /tmp/tail.txt
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="## 🔴 Fallo de Gradle (diagnóstico automático)

          <details><summary>Últimas líneas del log</summary>

          \`\`\`
          $(cat /tmp/tail.txt)
          \`\`\`
          </details>" || true
      - name: Renombrar APK
        run: |
          ls android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/PokeMod-Studio-FireAsh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PokeMod-Studio-FireAsh-APK
          path: android/app/build/outputs/apk/debug/PokeMod-Studio-FireAsh.apk
          if-no-files-found: error
      - name: Adjuntar a la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/PokeMod-Studio-FireAsh.apk
