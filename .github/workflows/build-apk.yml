name: PokeMod — Tests + APK

on:
  push:
    branches: ["arena/01a0de4c-fire-ash-modifier"]
    paths: ["web/**", "android/**", "tools/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch: {}
  release:
    types: [created]

jobs:
  test:
    name: Tests JS (Marshal/PBS/Table)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Marshal round-trip
        run: node web/js/marshal.test.mjs
      - name: Integración del núcleo
        run: node web/js/integration.test.mjs
      - name: Sintaxis de todos los módulos
        run: |
          for f in web/js/*.js; do
            case "$f" in *.test.mjs) continue;; esac
            node --check "$f" || exit 1
          done
          echo "Todos los módulos OK"

  build-apk:
    name: Compilar APK (debug)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Compilar con Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.7"
          arguments: assembleDebug
          build-root-directory: android
      - name: Renombrar APK
        run: |
          ls android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/PokeMod-Studio-FireAsh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PokeMod-Studio-FireAsh-APK
          path: android/app/build/outputs/apk/debug/PokeMod-Studio-FireAsh.apk
          if-no-files-found: error
      - name: Adjuntar a la Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/PokeMod-Studio-FireAsh.apk
